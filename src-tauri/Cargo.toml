[package]
name = "jadvalpro"
version = "2026.1.0"
description = "JadvalPro — maktab dars jadvalini avtomatik tuzuvchi dastur"
authors = ["JadvalPro"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jadvalpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
machine-uid = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
