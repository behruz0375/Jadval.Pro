# JadvalPro — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# "Create a Blueprint" bo'limida bu faylni ko'rsatsangiz, Render:
#   - jadvalpro-web  — React frontend (Static Site)
#   - jadvalpro-api  — FastAPI backend (Docker)
#   - jadvalpro-db   — PostgreSQL (bepul, 90 kun)
#   - DATABASE_URL va SECRET_KEY avtomatik ulanadi

databases:
  - name: jadvalpro-db
    databaseName: jadvalpro
    user: jadvalpro
    plan: free  # 1 GB, 90 kundan keyin suspend (zaxira olib qayta yaratish mumkin)
    region: frankfurt

services:
  # ── Frontend: React/Vite static site ────────────────────────────────────────
  - type: web
    name: jadvalpro-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_PUBLIC_DEPLOY
        value: "true"  # saytdan hech kim o'zini admin/zavuch deb ro'yxatdan o'tolmaydi
      - key: VITE_API_URL
        value: https://jadvalpro-api.onrender.com  # bulut backend URL (login va sinxron uchun)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # SPA — barcha yo'llar index.html ga
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable  # chunked fayllar uzun kesh

  # ── Backend: FastAPI Docker service ─────────────────────────────────────────
  - type: web
    name: jadvalpro-api
    runtime: docker
    plan: free  # 15 daqiqa harakatsizlikdan keyin uxlaydi, so'rovda qaytadan uyg'onadi
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true  # har git push dan keyin avto-deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jadvalpro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true  # Render tasodifiy 32-char token generatsiya qiladi
      - key: DEBUG
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: OWNER_LOGIN
        value: admin
      - key: OWNER_PASSWORD
        sync: false  # birinchi deploy'da Render dashboard'dan qo'lda kiritasiz
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5178,http://localhost:5181
      - key: CORS_ORIGIN_REGEX
        # onrender.com (Render preview + prod), Vercel/Netlify preview, o'z domen
        value: ^https?://(.*\.)?(onrender\.com|vercel\.app|netlify\.app|jadval\.pro)$
